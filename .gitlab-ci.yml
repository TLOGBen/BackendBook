# 建置 MkDocs 網站並發布到 GitLab Pages。
# main 分支：建置後發布；其他分支：只建置，確認沒有壞掉的連結。
image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

check:
  stage: test
  script:
    - pip install -r requirements.txt
    - mkdocs build --strict --site-dir public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - pip install -r requirements.txt
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
