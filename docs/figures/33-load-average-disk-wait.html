<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>load average 不等於 CPU</title>
<style>
:root{
  --bg:#ffffff; --ink:#1f2937; --muted:#4b5563; --soft:#6b7280; --line:#c7ccd4;
  --panel:#f8fafc; --panel2:#e7ebf0; --run:#64748b;
  --amber-fill:#fde68a; --amber-stroke:#b45309; --amber-ink:#111111;
  --err:#b91c1c; --err-fill:#fee2e2; --err-ink:#7f1d1d;
  --focus:#2563eb;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,"PingFang TC","Microsoft JhengHei",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e2129; --ink:#e5e7eb; --muted:#b9bfca; --soft:#9aa2b0; --line:#454c5c;
    --panel:#262a34; --panel2:#353b48; --run:#9aa7ba;
    --amber-fill:#5b3c0c; --amber-stroke:#f59e0b; --amber-ink:#fde68a;
    --err:#f87171; --err-fill:#451a1a; --err-ink:#fecaca;
    --focus:#7aa2f7; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e2129; --ink:#e5e7eb; --muted:#b9bfca; --soft:#9aa2b0; --line:#454c5c;
  --panel:#262a34; --panel2:#353b48; --run:#9aa7ba;
  --amber-fill:#5b3c0c; --amber-stroke:#f59e0b; --amber-ink:#fde68a;
  --err:#f87171; --err-fill:#451a1a; --err-ink:#fecaca;
  --focus:#7aa2f7; color-scheme:dark;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
.fig{margin:0;padding:8px 16px 12px;box-sizing:border-box;width:100%;outline:none}
.fig:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:6px}
.fig .stage{width:100%;margin:0 auto}
.fig .stage.narrow{max-width:480px}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{display:flex;gap:8px;align-items:baseline;min-height:3.2em;margin:8px auto 4px;font-size:15px;line-height:1.55;max-width:960px}
.fig .cap .step{flex:none;font-weight:700;color:var(--amber-stroke);white-space:nowrap}
.fig .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:960px;margin:0 auto}
.fig button{font:inherit;font-size:14px;min-height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.fig button:hover{border-color:var(--muted)}
.fig button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fig button.play{font-weight:700;min-width:88px}
.fig button.on{background:var(--amber-fill);border-color:var(--amber-stroke);color:var(--amber-ink);font-weight:700}
.fig input[type=range]{flex:1 1 160px;min-width:0;height:36px;margin:0;accent-color:var(--amber-stroke)}
.fig .keys{display:flex;gap:6px;flex-wrap:wrap}
.fig .theme{margin-left:auto}
/* svg parts */
.z-box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.z-box.hot{fill:var(--amber-fill);stroke:var(--amber-stroke);stroke-width:2.5}
.z-title{fill:var(--ink);font-weight:700}
.z-sub{fill:var(--muted)}
.z-mono{font-family:var(--mono)}
.v{fill:var(--ink);font-weight:700}
.v.hot,.t.hot{fill:var(--amber-stroke)}
.v.err,.t.err{fill:var(--err)}
.t{fill:var(--muted)}
.t.ink{fill:var(--amber-ink);font-weight:700}
.core{fill:none;stroke:var(--line);stroke-width:1.5}
.core.busy{fill:var(--panel2);stroke:var(--soft)}
.core.new{fill:none;stroke:var(--amber-stroke);stroke-width:2;stroke-dasharray:4 3}
.dot{stroke-width:1.5}
.dot.run{fill:var(--run);stroke:var(--run)}
.dot.wait{fill:var(--amber-fill);stroke:var(--amber-stroke);stroke-width:2}
.sw.run{fill:var(--run)}
.sw.wait{fill:var(--amber-fill);stroke:var(--amber-stroke);stroke-width:1.5}
.bar-bg{fill:var(--panel2);stroke:var(--line);stroke-width:1}
.mem-fill{fill:var(--run);opacity:.55}
.mem-cap{stroke:var(--ink);stroke-width:2}
.over{fill:var(--amber-fill);stroke:var(--amber-stroke);stroke-width:2;stroke-dasharray:5 3}
.lb-run{fill:var(--run)}
.lb-wait{fill:var(--amber-stroke)}
.iops{fill:var(--run)}
.iops.full{fill:var(--amber-stroke)}
.flow{stroke:var(--amber-stroke);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
.flow-head{fill:var(--amber-stroke)}
.disk{fill:var(--panel2);stroke:var(--soft);stroke-width:1.5}
.shade{fill:var(--bg)}
@media (prefers-reduced-motion: reduce){ .fig *{transition:none!important} }
</style>
</head>

     cores:4, need:240, fill:240, iops:0.15, flow:0.15, down:0,

  var L = {

            foot:[[752,332,'還該看：',''],[752,356,'vmstat 的 wa','mono'],[752,380,'CPU 閒著、在等磁碟',''],[752,404,'的時間比例',''],[752,452,'看 wa 和讀取延遲，','hot'],[752,476,'就知道是磁碟的問題','hot']]}

  // ---------- helpers ----------
  function el(tag, attrs, parent, text){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function setA(e, k, v){ e._c = e._c || {}; if (e._c[k] !== v){ e._c[k] = v; e.setAttribute(k, v); } }

    txt(g, d.mlab[0], d.mlab[1], fs.text, 'z-sub', 'IOPS ｜ 上限', 'end');
    if (d.icon){
      var ic = d.icon, rx = ic[2]/2, ry = 8;
      el('path', {d:'M' + ic[0] + ' ' + (ic[1]+ry) + ' v' + (ic[3]-2*ry) + ' a' + rx + ' ' + ry + ' 0 0 0 ' + ic[2] + ' 0 v-' + (ic[3]-2*ry) + ' a' + rx + ' ' + ry + ' 0 0 0 -' + ic[2] + ' 0 z', 'class':'disk'}, g);
      el('ellipse', {cx:ic[0]+rx, cy:ic[1]+ry, rx:rx, ry:ry, 'class':'disk'}, g);
    }
    var mt = d.meter;
    el('rect', {x:mt[0], y:mt[1], width:mt[2], height:mt[3], rx:4, 'class':'bar-bg'}, g);
    R.iops = el('rect', {x:mt[0], y:mt[1], width:0, height:mt[3], rx:4, 'class':'iops'}, g);
    el('line', {x1:mt[0] + mt[2], y1:mt[1] - 4, x2:mt[0] + mt[2], y2:mt[1] + mt[3] + 4, 'class':'mem-cap'}, g);
    txt(g, d.qlab[0], d.qlab[1], fs.text, 't hot', '在等磁碟的查詢（也算進 load average）');
    R.diskN = txt(g, d.note[0], d.note[1], fs.text, 't', '');

    // 值班工程師看的
    var e = C.eng;
    el('rect', {x:e.x, y:e.y, width:e.w, height:e.h, rx:8, 'class':'z-box'}, g);
    txt(g, e.title[0], e.title[1], fs.title, 'z-title', '值班工程師看的');
    txt(g, e.mono[0], e.mono[1], fs.text, 'z-sub z-mono', 'load average', e.mono[2] === 'end' ? 'end' : null);
    el('rect', {x:e.bar[0], y:e.bar[1], width:e.bar[2], height:e.bar[3], rx:4, 'class':'bar-bg'}, g);
    R.lbRun = el('rect', {x:e.bar[0], y:e.bar[1], width:0, height:e.bar[3], 'class':'lb-run'}, g);
    R.lbWait = el('rect', {x:e.bar[0], y:e.bar[1], width:0, height:e.bar[3], 'class':'lb-wait'}, g);
    R.load = txt(g, e.big[0], e.big[1], fs.mid, 'v err', '');
    [[e.f1, '＝', 'run', '在跑 CPU 的'], [e.f2, '＋', 'wait', '在等磁碟的']].forEach(function(f){
      txt(g, f[0][0], f[0][1], fs.text, 't', f[1]);
      el('rect', {x:f[0][0] + 20, y:f[0][1] - 12, width:12, height:12, rx:2, 'class':'sw ' + f[2]}, g);
      txt(g, f[0][0] + 38, f[0][1], fs.text, f[2] === 'wait' ? 't hot' : 't', f[3]);
    });
    R.jBox = el('rect', {x:e.j.x, y:e.j.y, width:e.j.w, height:e.j.h, rx:6, 'class':'z-box'}, g);
    R.judge = [0,1,2].map(function(k){ return txt(g, e.jl[0], e.jl[1] + k*e.jl[2], fs.text, 't', ''); });

    // 當時沒看的指標
    var sd = C.side;
    el('rect', {x:sd.x, y:sd.y, width:sd.w, height:sd.h, rx:8, 'class':'z-box'}, g);
    txt(g, sd.title[0], sd.title[1], fs.title, 'z-title', '當時沒看的指標');
    R.side = sd.rows.map(function(r){
      txt(g, r[0], r[1], fs.text, 'z-sub', r[4]);
      return txt(g, r[2], r[3], fs.mid, 'v', '', sd.vend ? 'end' : null);
    });
    sd.foot.forEach(function(f){
      var cls = f[3] === 'mono' ? 't z-mono' : f[3] === 'hot' ? 't hot' : 't';
      txt(g, f[0], f[1], fs.text, cls, f[2]);
    });

    // 程序點（最上層）
    var dotG = el('g', {}, g);
    R.dots = [];
    for (var n = 0; n < NDOT; n++) R.dots.push(el('circle', {cx:0, cy:0, r:7, 'class':'dot run', opacity:0}, dotG));

    // 重開機遮罩
    R.shade = el('g', {opacity:0}, g);
    el('rect', {x:h.x + 2, y:h.y + 56, width:h.w - 4, height:h.h - 60, rx:6, 'class':'shade', opacity:0.88}, R.shade);
    txt(R.shade, h.center[0], h.center[1], fs.mid, 'v err', '重開機中', 'middle');
    txt(R.shade, h.center[0], h.center[1] + 32, fs.text, 't', '資料庫斷線好幾分鐘', 'middle');

    svg.appendChild(frag);
    P = R;
  }

  function posOf(lc, C){
    if (lc.k === 'cpu'){ var c = C.cpu.core(lc.n); return {x:c.x + c.s/2, y:c.y + c.s/2, r:c.s*0.3}; }
    if (lc.k === 'q') return C.disk.q(lc.n);
    return null;
  }

  // ---------- 畫面＝t 的純函數 ----------
  var curT = REST;
  function render(t){
    curT = t;
    var C = P.C, fs = C.fs;
    var i = Math.min(S.length - 1, Math.floor(t / SEG));
    var a = S[Math.max(0, i - 1)], b = S[i];
    var p = i === 0 ? 1 : ease((t - i*SEG) / MOVE);
    var cur = p >= 0.4 ? b : a;

    // 主機規格與停機
    setT(P.spec, cur.spec); setA(P.spec, 'class', 'v z-mono' + (cur.specC ? ' ' + cur.specC : ''));
    var down = lerp(a.down, b.down, p);
    setA(P.shade, 'opacity', down.toFixed(3));

    // CPU 核心
    var cores = lerp(a.cores, b.cores, p), runNow = (p >= 0.5 ? PLAN[i] : PLAN[Math.max(0, i - 1)]).run;
    for (var k = 0; k < 16; k++){
      var op = k < 4 ? 1 : clamp((cores - 4) / 12);
      setA(P.cores[k], 'opacity', op.toFixed(3));
      var busy = k < runNow && down < 0.5;
      setA(P.cores[k], 'class', 'core' + (busy ? ' busy' : (k >= 4 ? ' new' : '')));
    }

    // 記憶體
    var mb = C.mem.bar, u = mb[2] / CAP;
    var fill = lerp(a.fill, b.fill, p), need = lerp(a.need, b.need, p);
    setA(P.memFill, 'width', (fill * u).toFixed(1));
    setA(P.memIn, 'opacity', fill > 150 ? '1' : '0');
    var ov = Math.max(0, need - CAP) * u * (1 - down);
    setA(P.over, 'width', ov.toFixed(1));
    setA(P.over, 'opacity', ov > 1 ? '1' : '0');
    setA(P.overT, 'x', (mb[0] + mb[2] + ov/2).toFixed(1));
    setA(P.overT, 'opacity', ov > 50 ? '1' : '0');

    // 讀磁碟的流
    var flow = lerp(a.flow, b.flow, p);
    setA(P.flow, 'opacity', flow.toFixed(3));
    setA(P.flowHead, 'opacity', flow.toFixed(3));
    setA(P.flowT, 'opacity', flow > 0.5 ? '1' : '0');
    setA(P.flow, 'stroke-dashoffset', (-(t * 24) % 12).toFixed(1));

    // IOPS
    var io = lerp(a.iops, b.iops, p), mt = C.disk.meter;
    setA(P.iops, 'width', (mt[2] * io).toFixed(1));
    setA(P.iops, 'class', 'iops' + (io > 0.95 ? ' full' : ''));

    // 程序點
    var runC = 0, waitC = 0;
    for (var dI = 0; dI < NDOT; dI++){
      var la = loc(Math.max(0, i - 1), dI), lb = loc(i, dI);
      var delay = (dI % 15) * 0.02;
      var pd = i === 0 ? 1 : ease((t - i*SEG - delay) / (MOVE - 0.3));
      var A = posOf(la, C), B = posOf(lb, C), dot = P.dots[dI];
      var x, y, r, o;
      if (A && B){ x = lerp(A.x, B.x, pd); y = lerp(A.y, B.y, pd); r = lerp(A.r, B.r, pd); o = 1; }
      else if (B){ x = lerp(C.entry.x, B.x, pd); y = lerp(C.entry.y, B.y, pd); r = B.r; o = pd; }
      else if (A){ x = A.x; y = A.y; r = A.r; o = 1 - pd; }
      else { o = 0; x = C.entry.x; y = C.entry.y; r = 7; }
      setA(dot, 'cx', x.toFixed(1)); setA(dot, 'cy', y.toFixed(1)); setA(dot, 'r', r.toFixed(1));
      setA(dot, 'opacity', o.toFixed(3));
      var kind = (pd >= 0.5 ? lb : la).k;
      if (kind === 'off') kind = (lb.k === 'off' ? la : lb).k;
      setA(dot, 'class', 'dot ' + (kind === 'q' ? 'wait' : 'run'));
      if (o > 0){ if (kind === 'q') waitC += o; else runC += o; }
    }
    var e = C.eng, lu = e.bar[2] / (NDOT + 1);
    setA(P.lbRun, 'width', (runC * lu).toFixed(1));
    setA(P.lbWait, 'x', (e.bar[0] + runC * lu).toFixed(1));
    setA(P.lbWait, 'width', (waitC * lu).toFixed(1));

    // 文字讀數
    var bigApi = cur.api.length <= 4;
    setT(P.api, cur.api); setA(P.api, 'font-size', bigApi ? fs.big : fs.mid);
    setA(P.api, 'class', 'v' + (cur.apiC ? ' ' + cur.apiC : ''));
    P.sub.forEach(function(s, n){ setT(s, cur.sub[n] || ''); setA(s, 'class', 't' + (cur.apiC === 'err' ? ' err' : '')); });
    setT(P.load, cur.load);
    setA(P.jBox, 'class', 'z-box' + (cur.jHot ? ' hot' : ''));
    P.judge.forEach(function(s, n){ setT(s, cur.judge[n] || ''); setA(s, 'class', 't' + (cur.jHot ? ' ink' : '')); });
    [['hit','hitC'],['lat','latC'],['cpu','cpuC']].forEach(function(f, n){
      var v = cur[f[0]], s = P.side[n];
      setT(s, v); setA(s, 'font-size', v.length > 5 ? fs.small : fs.mid);
      setA(s, 'class', 'v' + (cur[f[1]] ? ' ' + cur[f[1]] : ''));
    });
    setT(P.cpuN, cur.cpuN); setA(P.cpuN, 'class', 't' + (i >= 3 && cur.cpuN ? ' hot' : ''));
    setT(P.memN, cur.memN); setT(P.diskN, cur.diskN);
    setA(P.diskN, 'class', 't' + (cur.iops > 0.95 ? ' hot' : ''));

    // 圖說與控制
    var ci = Math.min(S.length - 1, Math.floor(t / SEG));
    if (capStep._i !== ci){
      capStep._i = ci; capStep.textContent = S[ci].step; capTxt.textContent = S[ci].cap;
      keyBtns.forEach(function(bt, n){ bt.classList.toggle('on', n === ci); bt.setAttribute('aria-pressed', n === ci ? 'true' : 'false'); });
    }
    if (+range.value !== t) range.value = t.toFixed(2);
    range.setAttribute('aria-valuetext', S[ci].step);
  }

  // ---------- 控制 ----------
  var capStep = fig.querySelector('.cap .step'), capTxt = fig.querySelector('.cap .txt');
  var range = fig.querySelector('input[type=range]');
  var playBtn = fig.querySelector('.play');
  var keysBox = fig.querySelector('.keys');
  var KEYT = S.map(function(s, n){ return n*SEG + 1.5; });
  var keyBtns = S.map(function(s, n){
    var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = 'T' + (n + 1);
    bt.setAttribute('aria-label', '跳到 ' + s.step);
    bt.addEventListener('click', function(){ seek(KEYT[n]); });
    keysBox.appendChild(bt); return bt;
  });

  var playing = false, stopAt = DUR, visible = false, raf = 0, last = 0;
  function setPlaying(on){
    playing = on;
    playBtn.textContent = on ? '❚❚ 暫停' : '▶ 播放';
    playBtn.setAttribute('aria-label', on ? '暫停' : '播放');
    arm();
  }
  function arm(){ if (playing && visible && !raf){ last = 0; raf = requestAnimationFrame(tick); } }
  function tick(now){
    raf = 0;
    if (!playing || !visible) return;
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
    var t = Math.min(stopAt, curT + dt);
    render(t);
    if (t >= stopAt){ setPlaying(false); return; }
    raf = requestAnimationFrame(tick);
  }
  function play(){ if (curT >= DUR - 0.01) render(0); stopAt = DUR; setPlaying(true); }
  function seek(t){ t = Math.max(0, Math.min(DUR, +t || 0)); setPlaying(false); render(t); }
  function stepTo(dir){
    var n;
    if (dir > 0){ for (n = 0; n < KEYT.length; n++) if (KEYT[n] > curT + 0.01) return seek(KEYT[n]); seek(KEYT[KEYT.length-1]); }
    else { for (n = KEYT.length - 1; n >= 0; n--) if (KEYT[n] < curT - 0.01) return seek(KEYT[n]); seek(0); }
  }
  playBtn.addEventListener('click', function(){ playing ? setPlaying(false) : play(); });
  fig.querySelector('.prev').addEventListener('click', function(){ stepTo(-1); });
  fig.querySelector('.next').addEventListener('click', function(){ stepTo(1); });
  range.addEventListener('input', function(){ seek(range.value); });
  fig.querySelector('.theme').addEventListener('click', function(){
    var root = document.documentElement;
    var c = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', c === 'dark' ? 'light' : 'dark');
  });
  fig.addEventListener('keydown', function(ev){
    if (ev.target !== fig) return;
    if (ev.key === 'ArrowRight'){ stepTo(1); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft'){ stepTo(-1); ev.preventDefault(); }
    else if (ev.key === ' ' || ev.key === 'Enter'){ playing ? setPlaying(false) : play(); ev.preventDefault(); }
    else if (ev.key === 'Home'){ seek(0); ev.preventDefault(); }
    else if (ev.key === 'End'){ seek(DUR); ev.preventDefault(); }
  });

  // ---------- 版面與可見性 ----------
  function pick(w){ return w >= 750 ? 'wide' : 'narrow'; } // 寬版 16px × 750/960 = 12.5px
  build(pick((fig.clientWidth || window.innerWidth) - 32));
  render(REST);
  if ('ResizeObserver' in window){
    new ResizeObserver(function(entries){
      var nm = pick(entries[0].contentRect.width);
      if (nm !== layoutName){ build(nm); render(curT); }
    }).observe(fig);
  }
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var introDone = reduce;
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      visible = es[0].isIntersecting;
      if (visible && !introDone){ introDone = true; render(0); stopAt = REST; playing = true; playBtn.textContent = '❚❚ 暫停'; playBtn.setAttribute('aria-label','暫停'); }
      arm();
    }, {rootMargin:'120px'}).observe(fig);
  } else { visible = true; }

  window.DUR = DUR;
  window.seek = seek;
  window.timeline = function(){ return {dur:DUR, rest:REST, keys:KEYT.slice()}; };
})();
</script>
</body>
</html>
