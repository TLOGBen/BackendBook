<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超賣的交錯</title>
<style>
:root{
  --paper:#ffffff; --paper-2:#f3f4f6; --ink:#1f2937; --muted:#4b5563; --soft:#5f6773;
  --rule:#d6d9de; --rule-strong:#9aa1ad;
  --hot-fill:#fde68a; --hot-stroke:#b45309; --hot-ink:#111111;
  --ok:#047857; --ok-fill:#e7f6ef; --link:#2e5aa8; --pkt-fill:#e6edfb;
  --focus:#2e5aa8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1e2129; --paper-2:#272b36; --ink:#e5e7eb; --muted:#c3c7cf; --soft:#a3aab6;
    --rule:#3a3f4c; --rule-strong:#5b6273;
    --hot-fill:#5a3a0e; --hot-stroke:#f59e0b; --hot-ink:#fef3c7;
    --ok:#34d399; --ok-fill:#173a30; --link:#8fb3ef; --pkt-fill:#22314d;
    --focus:#8fb3ef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1e2129; --paper-2:#272b36; --ink:#e5e7eb; --muted:#c3c7cf; --soft:#a3aab6;
  --rule:#3a3f4c; --rule-strong:#5b6273;
  --hot-fill:#5a3a0e; --hot-stroke:#f59e0b; --hot-ink:#fef3c7;
  --ok:#34d399; --ok-fill:#173a30; --link:#8fb3ef; --pkt-fill:#22314d;
  --focus:#8fb3ef;
  color-scheme: dark;
}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.4;
  -webkit-text-size-adjust:100%;
}
.fig{margin:0;padding:12px 16px 16px;max-width:880px;margin-inline:auto;box-sizing:border-box;outline:none}
.fig:focus-visible{outline:1px solid var(--focus);outline-offset:-2px;border-radius:8px}
.fig *{box-sizing:border-box}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans TC","Microsoft JhengHei",monospace}

/* 資料庫 */
.db{border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--paper-2);padding:8px 12px 12px}
.db-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.db-h b{color:var(--ink);font-size:13px}
.db-cells{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.cell{border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);padding:6px 10px;min-height:68px;display:flex;flex-direction:column;justify-content:center}
.cell .k{font-size:12px;color:var(--soft)}
.cell .v{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.cell .d{font-size:12px;min-height:17px;color:var(--muted)}
.cell.hot{background:var(--hot-fill);border-color:var(--hot-stroke);color:var(--hot-ink)}
.cell.hot .k,.cell.hot .d{color:var(--hot-ink)}

/* 連線 */
.wires{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:52px}
.wire{position:relative}
.wire .line{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1.5px dashed var(--rule-strong)}
.pkt{position:absolute;left:50%;top:0;transform:translate(-50%,0);height:22px;padding:0 6px;border-radius:4px;
  font-size:12px;line-height:20px;white-space:nowrap;border:1.5px solid var(--link);background:var(--pkt-fill);color:var(--ink);opacity:0}
.pkt.up{border-color:var(--hot-stroke);background:var(--hot-fill);color:var(--hot-ink)}

/* 請求卡 */
.reqs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.req{border:1.5px solid var(--rule-strong);border-radius:8px;padding:8px;background:var(--paper);min-width:0}
.req-h{font-weight:700;font-size:13px;margin-bottom:4px}
.steps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:2px}
.steps li{font-size:12px;padding:2px 4px;border-radius:4px;color:var(--soft);border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:clip}
.steps li.done{color:var(--muted)}
.steps li.now{color:var(--ink);border-color:var(--rule-strong);background:var(--paper-2);font-weight:600}
.steps li.now.hotstep{background:var(--hot-fill);border-color:var(--hot-stroke);color:var(--hot-ink)}
.vals{display:grid;gap:4px}
.val{border:1px solid var(--rule);border-radius:4px;padding:2px 6px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;min-height:28px}
.val .k{font-size:12px;color:var(--soft)}
.val b{font-size:17px;font-variant-numeric:tabular-nums}
.val .sub{font-size:12px;color:var(--soft)}
.val.calc{background:var(--hot-fill);border:1.5px solid var(--hot-stroke);color:var(--hot-ink)}
.val.calc .k,.val.calc .sub{color:var(--hot-ink)}
.val .in{opacity:0;display:contents}
.stale{font-size:12px;color:var(--hot-ink);background:var(--hot-fill);border:1px dashed var(--hot-stroke);border-radius:4px;padding:0 4px;line-height:16px;opacity:0}
.status{margin-top:6px;font-size:12px;border-radius:4px;padding:2px 6px;min-height:22px;border:1px solid var(--rule);color:var(--soft)}
.status.okay{border-color:var(--ok);background:var(--ok-fill);color:var(--ink)}

/* 讀數 */
.readout{margin-top:12px;display:flex;gap:8px;align-items:flex-start;min-height:44px}
.tstamp{flex:none;font-weight:700;font-size:13px;border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums}
#narr{font-size:14px}
.tally{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-top:1px solid var(--rule);padding-top:8px;opacity:0;min-height:48px}
.tally .big{font-size:16px;font-weight:700}
.tally .big em{font-style:normal;padding:0 4px;border-radius:4px;background:var(--hot-fill);color:var(--hot-ink);border:1px solid var(--hot-stroke)}
.tally .note{font-size:12px;color:var(--soft)}

/* 控制 */
.ctl{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule-strong);border-radius:6px;min-height:36px;min-width:36px;padding:0 10px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{width:100%;min-width:0;height:32px;margin:0;accent-color:var(--hot-stroke)}
.ticks{grid-column:1 / -1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ticks button{min-width:0;padding:0;font-size:12px;font-variant-numeric:tabular-nums}
.ticks button[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:600px){
  body{font-size:15px}
  .req{padding:10px 12px}
  .req-h{font-size:14px}
  .steps li{font-size:13px}
  .val b{font-size:19px}
  .cell .v{font-size:32px}
  #narr{font-size:15px}
  .wires{height:60px}
}
</style>
</head>
<body>
<figure class="fig" id="fig" data-fig="oversell-interleave" data-dur="14" data-rest="13.6" tabindex="0" role="group"
  aria-label="動畫：三個請求 A、B、C 在 T1 到 T7 交錯讀寫同一列庫存。三個都用 SELECT 讀到 stock 37、都算出 36、都用 UPDATE 寫回 36，於是成立三筆訂單（orders 從 263 變成 266），庫存卻只從 37 減成 36。可用播放鈕、時間軸，或左右方向鍵逐步查看。">

  <div class="db" aria-hidden="true">
    <div class="db-h"><b>資料庫（PostgreSQL）</b><span>限量 300 組，已賣出 263 組</span></div>
    <div class="db-cells">
      <div class="cell" id="cStock"><span class="k mono">products.stock</span><span class="v mono" id="vStock">37</span><span class="d" id="dStock"></span></div>
      <div class="cell" id="cOrders"><span class="k"><span class="mono">orders</span> 列數</span><span class="v mono" id="vOrders">263</span><span class="d" id="dOrders"></span></div>
    </div>
  </div>

  <div class="wires" aria-hidden="true">
    <div class="wire"><span class="line"></span><span class="pkt mono" id="p0"></span></div>
    <div class="wire"><span class="line"></span><span class="pkt mono" id="p1"></span></div>
    <div class="wire"><span class="line"></span><span class="pkt mono" id="p2"></span></div>
  </div>

  <div class="reqs" aria-hidden="true">
    <!-- 三張請求卡由下方程式依同一個模板產生 -->
  </div>

  <div class="readout"><span class="tstamp mono" id="tstamp">T7</span><span id="narr" aria-live="polite"></span></div>
  <div class="tally" id="tally">
    <span class="big">訂單 <em>+3</em>，庫存只 <em>−1</em></span>
    <span class="note">API 全部回 200，日誌沒有錯誤。開賣後這種交錯一再發生，對帳時 orders 有 412 筆，比 300 組多了 112 筆。</span>
  </div>

  <div class="ctl">
    <button type="button" id="play" aria-label="播放">▶ 播放</button>
    <input type="range" id="scrub" min="0" max="14" step="0.01" value="13.6" aria-label="時間軸，拖動查看 T1 到 T7">
    <button type="button" id="theme" aria-label="切換深淺色">◐</button>
    <div class="ticks" id="ticks"></div>
  </div>
</figure>

<script>
(function(){
  var fig=document.getElementById('fig');
  var DUR=+fig.dataset.dur, REST=+fig.dataset.rest, STEP=2;
  window.DUR=DUR;
  var NAMES=['A','B','C'];
  var NARR=[
    '請求 A 用 SELECT 讀到 stock = 37。',
    '請求 B 也讀到 37：A 算好的值還沒寫回去。',
    '請求 C 也讀到 37。三個請求手上都是同一個 37。',
    '三個請求都判斷 37 > 0，各自在程式裡算出 36。',
    'A 用 UPDATE 寫入 36，新增一筆訂單。B、C 手上的 37 已經過時了。',
    'B 也寫入 36：蓋掉的值本來就是 36，庫存沒有再減，訂單卻又多一筆。',
    'C 也寫入 36：三筆訂單都成立，庫存卻只少了 1。'
  ];

  // 產生三張請求卡
  var reqs=fig.querySelector('.reqs');
  NAMES.forEach(function(n,i){
    var d=document.createElement('div');
    d.className='req'; d.id='r'+i;
    d.innerHTML=
      '<div class="req-h">請求 '+n+'</div>'+
      '<ol class="steps">'+
        '<li data-s="0">① <span class="mono">SELECT</span></li>'+
        '<li data-s="1">② 判斷、算</li>'+
        '<li data-s="2">③ <span class="mono">UPDATE</span></li>'+
      '</ol>'+
      '<div class="vals">'+
        '<div class="val read"><span class="k">讀到</span><b class="mono rv">37</b><span class="stale">已過時</span></div>'+
        '<div class="val calc"><span class="k">算出</span><b class="mono cv">36</b><span class="sub mono">37−1</span></div>'+
      '</div>'+
      '<div class="status"></div>';
    reqs.appendChild(d);
  });
  var R=NAMES.map(function(_,i){
    var r=document.getElementById('r'+i);
    return {steps:r.querySelectorAll('.steps li'),read:r.querySelector('.val.read'),calc:r.querySelector('.val.calc'),
      stale:r.querySelector('.stale'),status:r.querySelector('.status'),pkt:document.getElementById('p'+i),wire:r};
  });
  var ticks=document.getElementById('ticks');
  for(var k=1;k<=7;k++){
    var b=document.createElement('button'); b.type='button'; b.textContent='T'+k; b.className='mono';
    b.setAttribute('aria-label','跳到 T'+k);
    (function(k){ b.addEventListener('click',function(){ pause(); seek((k-1)*STEP+1.6); }); })(k);
    ticks.appendChild(b);
  }
  var tickBtns=ticks.querySelectorAll('button');
  var el={stock:document.getElementById('vStock'),orders:document.getElementById('vOrders'),cStock:document.getElementById('cStock'),
    cOrders:document.getElementById('cOrders'),dStock:document.getElementById('dStock'),dOrders:document.getElementById('dOrders'),
    narr:document.getElementById('narr'),tstamp:document.getElementById('tstamp'),tally:document.getElementById('tally'),
    scrub:document.getElementById('scrub'),play:document.getElementById('play')};

  function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
  function ramp(p,a,b){return clamp((p-a)/(b-a),0,1);}
  function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  var cache={}, wireH=52; // 連線高度只在 resize 時讀一次
  function set(node,key,prop,val){ var id=key+prop; if(cache[id]===val) return; cache[id]=val;
    if(prop==='text') node.textContent=val; else if(prop==='cls') node.className=val; else node.style[prop]=val; }

  // 畫出時間 t 的那一格（純函數：同一個 t 永遠同一個畫面）
  function draw(t){
    t=clamp(t,0,DUR);
    var k=Math.min(7,Math.floor(t/STEP)+1), p=clamp((t-(k-1)*STEP)/STEP,0,1);
    function arrived(j){return j<k||(j===k&&p>=0.55);}
    function fadeIn(j){return j<k?1:(j===k?ramp(p,0.55,0.7):0);}
    var wrote=(arrived(5)?1:0)+(arrived(6)?1:0)+(arrived(7)?1:0);

    // 資料庫
    set(el.stock,'s','text',arrived(5)?'36':'37');
    set(el.orders,'o','text',String(263+wrote));
    var writing=k>=5&&arrived(k);
    set(el.cStock,'cs','cls','cell'+(writing?' hot':''));
    set(el.dStock,'ds','text',!writing?'':(k===5?'37 → 36':'36 → 36，沒變'));
    set(el.dOrders,'do','text',writing?'+1 筆':'');

    for(var i=0;i<3;i++){
      var r=R[i], sel=i+1, upd=5+i;
      // 步驟列
      var nowS=-1, doneS=[k>sel||(k===sel&&p>=0.55), k>4||(k===4&&p>=0.35), arrived(upd)];
      if(k===sel) nowS=0; else if(k===4) nowS=1; else if(k===upd) nowS=2;
      for(var s=0;s<3;s++){
        set(r.steps[s],'st'+i+s,'cls',(s===nowS?'now'+(s===1?' hotstep':''):(doneS[s]?'done':'')));
      }
      // 讀到、算出
      var rv=fadeIn(sel);
      set(r.read,'ro'+i,'opacity',String(0.25+0.75*rv));
      set(r.read.querySelector('.rv'),'rt'+i,'text',rv>0?'37':'—');
      var cv=k>4?1:(k===4?ramp(p,0.15,0.35):0);
      set(r.calc,'co'+i,'opacity',String(cv>0?0.25+0.75*cv:0.25));
      set(r.calc,'cc'+i,'cls',cv>0?'val calc':'val');
      set(r.calc.querySelector('.cv'),'ct'+i,'text',cv>0?'36':'—');
      set(r.calc.querySelector('.sub'),'cs'+i,'text',cv>0?'37−1':'');
      set(r.stale,'sl'+i,'opacity',i===0?'0':String(fadeIn(5)));
      // 訂單狀態
      var ok=arrived(upd);
      set(r.status,'sc'+i,'cls','status'+(ok?' okay':''));
      set(r.status,'sx'+i,'text',ok?'✓ 訂單成立':(k>=upd-1&&k<upd?'等著寫回':'　'));
      // 封包
      var pk=r.pkt, H=wireH, ph=22, travel=H-ph, y=0, op=0, up=false, txt='';
      if(k===sel&&p<0.6){ var x=eio(ramp(p,0.05,0.55)); y=x*travel; op=Math.min(ramp(p,0.02,0.1),1-ramp(p,0.55,0.6)); txt='SELECT 37'; }
      else if(k===upd&&p<0.6){ var x2=eio(ramp(p,0.05,0.55)); y=(1-x2)*travel; op=Math.min(ramp(p,0.02,0.1),1-ramp(p,0.55,0.6)); txt='UPDATE 36'; up=true; }
      set(pk,'pt'+i,'text',txt);
      set(pk,'pc'+i,'cls','pkt mono'+(up?' up':''));
      set(pk,'po'+i,'opacity',String(op));
      set(pk,'py'+i,'transform','translate(-50%,'+y.toFixed(1)+'px)');
    }
    set(el.tstamp,'ts','text','T'+k);
    set(el.narr,'na','text',NARR[k-1]);
    set(el.tally,'ta','opacity',String(k===7?ramp(p,0.6,0.75):0));
    for(var j=0;j<7;j++){ var cur=(j===k-1); if(cache['tk'+j]!==cur){ cache['tk'+j]=cur; if(cur) tickBtns[j].setAttribute('aria-current','step'); else tickBtns[j].removeAttribute('aria-current'); } }
    if(document.activeElement!==el.scrub) el.scrub.value=t.toFixed(2);
    fig.setAttribute('aria-valuetext','T'+k+'：'+NARR[k-1]);
  }

  // 時鐘：只有播放中且在畫面內才跑
  var T=REST, playing=false, visible=true, raf=0, last=0;
  function frame(now){
    raf=0;
    if(!playing||!visible) return;
    var dt=last?Math.min(0.1,(now-last)/1000):0; last=now;
    T+=dt;
    if(T>=DUR){ T=DUR; draw(T); pause(); return; }
    draw(T);
    raf=requestAnimationFrame(frame);
  }
  function arm(){ if(!raf&&playing&&visible){ last=0; raf=requestAnimationFrame(frame); } }
  function play(){ if(T>=REST-0.01) T=0; playing=true; el.play.textContent='❚❚ 暫停'; el.play.setAttribute('aria-label','暫停'); arm(); }
  function pause(){ playing=false; if(raf){cancelAnimationFrame(raf); raf=0;} el.play.textContent='▶ 播放'; el.play.setAttribute('aria-label','播放'); }
  function seek(t){ pause(); T=clamp(+t||0,0,DUR); draw(T); }
  window.seek=seek;
  window.timeline=function(){return {dur:DUR,rest:REST};};

  el.play.addEventListener('click',function(){ playing?pause():play(); });
  el.scrub.addEventListener('input',function(){ seek(+el.scrub.value); });
  fig.addEventListener('keydown',function(e){
    if(e.target===el.scrub) return;
    var k=Math.min(7,Math.floor(T/STEP)+1);
    if(e.key==='ArrowRight'){ e.preventDefault(); seek(Math.min(7,k+1)*STEP-STEP+1.6); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); seek(Math.max(1,k-1)*STEP-STEP+1.6); }
    else if(e.key==='Home'){ e.preventDefault(); seek(1.6); }
    else if(e.key==='End'){ e.preventDefault(); seek(REST); }
    else if((e.key===' '||e.key==='Enter')&&e.target===fig){ e.preventDefault(); playing?pause():play(); }
  });

  // 深淺色切換：在根元素設 data-theme（網站也會從外面設）
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  document.getElementById('theme').addEventListener('click',function(){
    var root=document.documentElement, cur=root.getAttribute('data-theme')||(mq.matches?'dark':'light');
    root.setAttribute('data-theme',cur==='dark'?'light':'dark');
  });

  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ visible=es[0].isIntersecting; if(visible) arm(); },{rootMargin:'120px'}).observe(fig);
  }
  // 尺寸改變時重畫（封包行程跟著連線高度），並把高度告訴嵌入的網站
  var lastH=0;
  function onResize(){ wireH=R[0].pkt.parentNode.clientHeight||52; cache={}; draw(T); var h=Math.ceil(document.documentElement.scrollHeight);
    if(h!==lastH&&window.parent!==window){ lastH=h; window.parent.postMessage({type:'figure-height',fig:fig.dataset.fig,height:h},'*'); } }
  window.addEventListener('resize',function(){ requestAnimationFrame(onResize); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(onResize);

  // 一開始停在 data-rest（T7：三筆訂單、stock 36）；不自動播放，reduced motion 也一樣
  draw(T);
  requestAnimationFrame(onResize);
})();
</script>
</body>
</html>
