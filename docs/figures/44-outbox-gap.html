<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信箱模式：死在縫裡的事件</title>
<style>
:root{
  --paper:#ffffff; --paper-2:#f3f4f6; --ink:#1f2937; --muted:#4b5563; --soft:#5a6580;
  --rule:rgba(31,41,55,.14); --rule-solid:#c7cbd1;
  --hot-fill:#fde68a; --hot-line:#b45309; --hot-ink:#111111;
  --bad:#b42318; --ok:#1f7a45; --chip:#e8edf5; --chip-ink:#1f2937;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans TC","Microsoft JhengHei",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1e2130; --paper-2:#272b3d; --ink:#eef0f4; --muted:#c3c7d0; --soft:#a3abbd;
    --rule:rgba(238,240,244,.16); --rule-solid:rgba(195,199,208,.32);
    --hot-fill:#4a3608; --hot-line:#f59e0b; --hot-ink:#fde68a;
    --bad:#f6877b; --ok:#6fd49a; --chip:#33384d; --chip-ink:#eef0f4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1e2130; --paper-2:#272b3d; --ink:#eef0f4; --muted:#c3c7d0; --soft:#a3abbd;
  --rule:rgba(238,240,244,.16); --rule-solid:rgba(195,199,208,.32);
  --hot-fill:#4a3608; --hot-line:#f59e0b; --hot-ink:#fde68a;
  --bad:#f6877b; --ok:#6fd49a; --chip:#33384d; --chip-ink:#eef0f4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%}
.fig{margin:0;padding:12px 16px 16px;outline:none;max-width:960px;margin-inline:auto}
.fig:focus-visible{box-shadow:inset 0 0 0 2px var(--hot-line);border-radius:8px}

/* step line */
.say{display:flex;gap:8px;align-items:flex-start;min-height:48px;margin-bottom:12px}
.say .tag{flex:none;font:600 12px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--hot-fill);color:var(--hot-ink);border:1px solid var(--hot-line);white-space:nowrap}
.say .txt{font-size:14px;font-weight:600;padding-top:2px}

/* lanes */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:560px){.lanes{gap:24px}}
.lane{min-width:0;display:flex;flex-direction:column}
.lane-h{height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-bottom:2px solid var(--rule-solid);margin-bottom:12px;text-align:center}
.lane[data-lane="b"] .lane-h{border-bottom-color:var(--ok)}

.node{position:relative;min-height:64px;padding:8px 12px;border:1.5px solid var(--rule-solid);border-radius:8px;background:var(--paper-2);transition:background-color .2s,border-color .2s}
.node .nm{font-weight:700;font-size:14px;line-height:1.3}
.node .nm .sub{font:500 12px var(--mono);color:var(--soft);margin-left:2px;word-break:break-all}
.node .st{margin-top:4px;font-size:13px;color:var(--muted)}
.node.hot{background:var(--hot-fill);border-color:var(--hot-line);border-width:2px;box-shadow:0 0 0 3px color-mix(in srgb,var(--hot-line) 18%,transparent)}
.node.hot .nm,.node.hot .st{color:var(--hot-ink)}
.node.hot .nm .sub{color:var(--hot-ink);opacity:.8}
.node.ghost{background:transparent;border-style:dashed}
.node.dead .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--bad)}
.st .bad{color:var(--bad);font-weight:700}
.node.hot .st .bad{color:var(--bad)}
:root[data-theme="dark"] .node.hot .st .bad{color:#ffb4a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .node.hot .st .bad{color:#ffb4a8}}
.st .ok{color:var(--ok);font-weight:700}

/* table rows / chips */
.tbl{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:500 12px/1.3 var(--mono);color:var(--chip-ink);background:var(--chip);border:1.5px solid var(--rule-solid);border-radius:6px;padding:4px 6px;transform-origin:left center}
.trow .k{color:var(--soft)}
.node.hot .trow{background:rgba(255,255,255,.55);color:#111;border-color:var(--hot-line)}
.node.hot .trow .k{color:#5b4210}
:root[data-theme="dark"] .node.hot .trow{background:rgba(0,0,0,.25);color:var(--hot-ink)}
:root[data-theme="dark"] .node.hot .trow .k{color:#f3cf7a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .node.hot .trow{background:rgba(0,0,0,.25);color:var(--hot-ink)}
  :root:not([data-theme="light"]) .node.hot .trow .k{color:#f3cf7a}
}
.trow.pending{border-style:dashed}
.trow.gone{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.trow .badge{font:700 12px/1 var(--font);padding:2px 4px;border-radius:4px}
.trow .badge.bad{color:var(--bad)}
.trow .badge.ok{color:var(--ok)}
.hide{display:none!important}

/* connectors */
.link{position:relative;height:28px;display:flex;align-items:center;padding-left:26px}
.link::before{content:"";position:absolute;left:18px;top:2px;bottom:6px;border-left:2px solid var(--rule-solid)}
.link::after{content:"";position:absolute;left:13px;bottom:1px;border:6px solid transparent;border-top:7px solid var(--rule-solid);border-bottom:0}
.link .lb{font:500 12px/1.2 var(--mono);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link.on::before{border-left-color:var(--hot-line);border-left-width:3px;left:17.5px}
.link.on::after{border-top-color:var(--hot-line)}
.link.on .lb{color:var(--ink);font-weight:700}
.link.faint{opacity:.45}
.link.faint::before{border-left-style:dashed}
.link .ack{margin-left:6px;font:700 12px/1 var(--mono);color:var(--ok);white-space:nowrap}

/* result */
.res{margin-top:12px;min-height:56px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid transparent}
.res.bad{border-color:var(--bad);color:var(--ink);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.res.ok{border-color:var(--ok);color:var(--ink);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.res.empty{border-color:var(--rule);color:var(--soft);font-weight:500}

/* controls */
.ctrl{display:flex;align-items:center;gap:8px;margin-top:16px}
.btn{flex:none;width:40px;height:40px;border-radius:8px;border:1.5px solid var(--rule-solid);background:var(--paper-2);color:var(--ink);font:700 16px/1 var(--font);cursor:pointer;display:grid;place-items:center;padding:0}
.btn:hover{border-color:var(--hot-line)}
.btn:focus-visible{outline:2px solid var(--hot-line);outline-offset:2px}
.btn svg{width:16px;height:16px;fill:currentColor}
.scrub{flex:1;min-width:0;height:32px;accent-color:var(--hot-line);cursor:pointer;margin:0}
.ticks{list-style:none;margin:8px 0 0;padding:0 48px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ticks button{width:100%;min-height:32px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--muted);font:600 12px/1.1 var(--font);cursor:pointer;padding:2px}
.ticks button[aria-current="step"]{background:var(--hot-fill);color:var(--hot-ink);border-color:var(--hot-line)}
.ticks button:focus-visible{outline:2px solid var(--hot-line);outline-offset:1px}
@media (max-width:420px){
  .fig{padding:8px 8px 12px}
  .node{padding:8px}
  .ticks{padding:0}
}
</style>
</head>
<body>
<figure class="fig" id="og" data-fig="outbox-gap" data-dur="6" data-rest="2.99" tabindex="0"
  aria-label="對照兩種寫法：先 COMMIT 再發訊息時，訂單 #5001 寫進 PostgreSQL 後 Pod 在 producer.send 前被砍，事件跟著消失，出貨服務一直沒收到；信箱模式把事件和訂單寫在同一個交易的 outbox 表，Pod 被砍後事件還在，relay 之後撈到並送到 Kafka，出貨服務收到事件。">
  <div class="say" aria-live="polite"><span class="tag" id="og-tag">T3</span><span class="txt" id="og-say"></span></div>

  <div class="lanes">
    <!-- 左：先 COMMIT 再發訊息 -->
    <section class="lane" data-lane="a" aria-label="先 COMMIT 再發訊息">
      <div class="lane-h">先 COMMIT 再發訊息</div>
      <div class="node" id="a-pod"><div class="nm">訂單服務 <span class="sub">Pod</span></div><div class="st" id="a-pod-st"></div>
        <div class="tbl"><div class="trow" id="a-evt"><span>OrderCreated #5001</span><span class="k" id="a-evt-k">只在程式裡</span></div></div>
      </div>
      <div class="link" id="a-l1"><span class="lb">INSERT orders</span></div>
      <div class="node" id="a-db"><div class="nm">PostgreSQL</div>
        <div class="tbl"><div class="trow" id="a-ord"><span class="k">orders</span><span>#5001</span><span class="k" id="a-ord-k"></span></div></div>
      </div>
      <div class="link faint" id="a-l2"><span class="lb">（沒人去撈）</span></div>
      <div class="node ghost" id="a-relay"><div class="nm">relay</div><div class="st" id="a-relay-st"></div></div>
      <div class="link faint" id="a-l3"><span class="lb">producer.send</span></div>
      <div class="node" id="a-mq"><div class="nm">Kafka <span class="sub">order-events</span></div><div class="st" id="a-mq-st"></div></div>
      <div class="link faint" id="a-l4"><span class="lb">投遞</span></div>
      <div class="node" id="a-ship"><div class="nm">出貨服務</div><div class="st" id="a-ship-st"></div></div>
      <div class="res" id="a-res"></div>
    </section>

    <!-- 右：信箱模式 -->
    <section class="lane" data-lane="b" aria-label="信箱模式">
      <div class="lane-h">信箱模式</div>
      <div class="node" id="b-pod"><div class="nm">訂單服務 <span class="sub">Pod</span></div><div class="st" id="b-pod-st"></div></div>
      <div class="link" id="b-l1"><span class="lb">同一個交易</span></div>
      <div class="node" id="b-db"><div class="nm">PostgreSQL</div>
        <div class="tbl">
          <div class="trow" id="b-ord"><span class="k">orders</span><span>#5001</span></div>
          <div class="trow" id="b-evt"><span class="k">outbox</span><span>OrderCreated #5001</span><span class="k" id="b-evt-k">published_at NULL</span><span class="badge ok hide" id="b-evt-b">還在</span></div>
        </div>
      </div>
      <div class="link" id="b-l2"><span class="lb">撈未發布的列</span></div>
      <div class="node" id="b-relay"><div class="nm">relay</div><div class="st" id="b-relay-st"></div></div>
      <div class="link" id="b-l3"><span class="lb">送出事件</span><span class="ack hide" id="b-ack">↑ ack</span></div>
      <div class="node" id="b-mq"><div class="nm">Kafka <span class="sub">order-events</span></div><div class="st" id="b-mq-st"></div></div>
      <div class="link" id="b-l4"><span class="lb">投遞</span></div>
      <div class="node" id="b-ship"><div class="nm">出貨服務</div><div class="st" id="b-ship-st"></div></div>
      <div class="res" id="b-res"></div>
    </section>
  </div>

  <div class="ctrl">
    <button class="btn" id="og-play" type="button" aria-label="播放"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="og-play-ic" d="M4 2.5v11l9-5.5z"/></svg></button>
    <input class="scrub" id="og-scrub" type="range" min="0" max="6" step="0.01" value="2.99" aria-label="時間軸：拖曳看每一步">
    <button class="btn" id="og-theme" type="button" aria-label="切換深淺色">◐</button>
  </div>
  <ol class="ticks" id="og-ticks"></ol>
</figure>

<script>
(function(){
  "use strict";
  var fig = document.getElementById("og");
  var DUR = 6, REST = 2.99, SPEED = 1/1.8; // 一格約 1.8 秒
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function(id){ return document.getElementById(id); };

  var STEPS = [
    {tag:"T1 10:05", tick:"T1", say:"使用者 A 結帳：INSERT INTO orders，訂單 #5001 還沒 commit"},
    {tag:"T2", tick:"T2", say:"離開 with 區塊，COMMIT 成功"},
    {tag:"T3", tick:"T3", say:"正要 producer.send，Pod 收到 SIGTERM 就被砍掉"},
    {tag:"之後", tick:"撈列", say:"新的 Pod 起來；右邊的 relay 撈到還沒送的 outbox 列"},
    {tag:"之後", tick:"送出", say:"relay 把事件送到 Kafka，等到 ack"},
    {tag:"結果", tick:"結果", say:"左邊：兩天後還沒出貨。右邊：標記 published_at，出貨服務收到事件"}
  ];

  // ticks
  var ticks = $("og-ticks"), tickBtns = [];
  STEPS.forEach(function(s, i){
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.textContent = s.tick; b.setAttribute("aria-label", "跳到第 " + (i+1) + " 步：" + s.say);
    b.addEventListener("click", function(){ pause(); seek(i + 0.99); });
    li.appendChild(b); ticks.appendChild(li); tickBtns.push(b);
  });

  function cls(el, name, on){ el.classList.toggle(name, !!on); }
  function html(id, v){ var el = $(id); if (el._v !== v){ el.innerHTML = v; el._v = v; } }
  function pop(el, p, from){ // 從 from 開始在 0.25 內淡入放大；回傳是否已出現
    var k = Math.max(0, Math.min(1, (p - from) / 0.25));
    el.style.opacity = String(0.15 + 0.85 * k);
    el.style.transform = "scale(" + (0.92 + 0.08 * k) + ")";
  }
  function clearPop(el){ el.style.opacity = ""; el.style.transform = ""; }

  var BAD = function(s){ return '<span class="bad">' + s + '</span>'; };
  var OK  = function(s){ return '<span class="ok">' + s + '</span>'; };
  var lastStage = -1;

  function draw(t){
    t = Math.max(0, Math.min(DUR, t));
    var s = Math.min(5, Math.floor(t)), p = t - s; if (t >= DUR) p = 1;
    var step = STEPS[s];
    html("og-tag", step.tag); html("og-say", step.say);
    if (s !== lastStage){ tickBtns.forEach(function(b, i){ if (i === s) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); }); lastStage = s; }

    // ---------- 左欄 ----------
    var aPod = $("a-pod"), aEvt = $("a-evt");
    cls(aPod, "hot", s === 0 || s === 2); cls(aPod, "dead", s === 2 && p >= 0.45);
    html("a-pod-st", [ "INSERT INTO orders", "COMMIT 成功", p < 0.45 ? "正要 producer.send…" : BAD("收到 SIGTERM，被砍掉"), "新的 Pod：只處理新的請求", "新的 Pod：只處理新的請求", "新的 Pod：只處理新的請求" ][s]);
    // 事件只在程式裡；Pod 一死就沒了
    var evtGone = s > 2 || (s === 2 && p >= 0.45);
    cls(aEvt, "gone", evtGone); cls(aEvt, "pending", !evtGone);
    html("a-evt-k", evtGone ? '<span class="badge bad">事件沒了</span>' : "只在程式裡，待送");
    if (s === 0) pop(aEvt, p, 0.3); else if (s === 2 && p >= 0.45) { aEvt.style.opacity = String(1 - 0.5 * Math.min(1, (p - 0.45) / 0.3)); aEvt.style.transform = ""; } else if (evtGone) { aEvt.style.opacity = "0.5"; aEvt.style.transform = ""; } else clearPop(aEvt);

    var aDb = $("a-db"), aOrd = $("a-ord");
    cls(aDb, "hot", s === 0 || s === 1);
    cls(aOrd, "pending", s === 0);
    html("a-ord-k", s === 0 ? "還沒 commit" : "已 commit ✓");
    if (s === 0) pop(aOrd, p, 0.05); else clearPop(aOrd);
    cls($("a-l1"), "on", s === 0 || s === 1);

    var aRelay = $("a-relay");
    cls(aRelay, "hot", s === 3);
    html("a-relay-st", s >= 3 ? "沒有任何程式記得 #5001 的事件還沒送" : "沒有這支程式");
    cls($("a-l3"), "on", s === 2 && p < 0.45);
    cls($("a-l3"), "faint", !(s === 2 && p < 0.45));

    var aMq = $("a-mq");
    cls(aMq, "hot", s === 4);
    html("a-mq-st", s >= 4 ? BAD("一直沒有 #5001 的事件") : "沒有 #5001 的事件");

    var aShip = $("a-ship");
    cls(aShip, "hot", s === 5);
    html("a-ship-st", s === 5 ? "T4（之後兩天）" + "<br>" + BAD("沒收到事件，不會安排出貨") : "沒事做");

    var aRes = $("a-res");
    var aResTxt = s < 2 ? "" : (s < 5 ? "事件還沒送出去就跟著 Pod 一起沒了" : "日誌裡沒有任何錯誤。10:00–10:20 升級時段，同樣的事發生了 37 次");
    html("a-res", aResTxt || "訂單已寫進資料庫，事件還在程式裡等著送");
    aRes.className = "res " + (s < 2 ? "empty" : "bad");

    // ---------- 右欄 ----------
    var bPod = $("b-pod");
    cls(bPod, "hot", s === 0 || s === 2); cls(bPod, "dead", s === 2 && p >= 0.45);
    html("b-pod-st", [ "INSERT orders<br>＋ INSERT outbox", "COMMIT（兩筆一起成功）", p < 0.45 ? "沒有下一步要做" : BAD("收到 SIGTERM，被砍掉"), "新的 Pod：只處理新的請求", "新的 Pod：只處理新的請求", "新的 Pod：只處理新的請求" ][s]);

    var bDb = $("b-db"), bOrd = $("b-ord"), bEvt = $("b-evt");
    var published = s === 5;
    cls(bDb, "hot", s === 0 || s === 1 || (s === 2 && p >= 0.45) || (s === 5 && p < 0.45));
    cls(bOrd, "pending", s === 0); cls(bEvt, "pending", s === 0);
    html("b-evt-k", published ? "published_at 有值" : "published_at NULL");
    cls($("b-evt-b"), "hide", !(s >= 2 && s <= 3 && (s === 3 || p >= 0.45)));
    if (s === 0){ pop(bOrd, p, 0.05); pop(bEvt, p, 0.3); } else { clearPop(bOrd); clearPop(bEvt); }
    cls($("b-l1"), "on", s === 0 || s === 1);

    var bRelay = $("b-relay");
    cls(bRelay, "hot", s === 3 || (s === 5 && p < 0.45));
    html("b-relay-st", [ "每隔一小段時間撈一次", "每隔一小段時間撈一次", "每隔一小段時間撈一次", "撈到 published_at 是 NULL 的列", "送出事件，等 ack", p < 0.45 ? "收到 ack，標記 published_at" : "這筆完成了" ][s]);
    cls($("b-l2"), "on", s === 3);
    cls($("b-l3"), "on", s === 4);
    cls($("b-ack"), "hide", !(s === 4 && p >= 0.55));

    var bMq = $("b-mq");
    cls(bMq, "hot", s === 4);
    html("b-mq-st", s < 4 ? "還沒有 #5001 的事件" : (s === 4 && p < 0.35 ? "接收中…" : "有 OrderCreated #5001"));

    var bShip = $("b-ship");
    var delivered = s === 5 && p >= 0.45;
    cls(bShip, "hot", delivered);
    cls($("b-l4"), "on", delivered);
    html("b-ship-st", delivered ? OK("收到事件，安排出貨") : "沒事做");

    var bRes = $("b-res");
    var bResTxt = s < 2 ? "事件跟訂單寫在同一個交易，一起成功或一起作廢" : (s < 5 ? "outbox 列還在，relay 重啟後也撈得到，只是晚一點送" : "訂單和事件都到了，不會只成功一半");
    html("b-res", bResTxt);
    bRes.className = "res " + (s < 2 ? "empty" : "ok");

    fig.dataset.t = t.toFixed(2);
    return t;
  }

  // ---------- 時間軸與播放 ----------
  var scrub = $("og-scrub"), playBtn = $("og-play"), playIc = $("og-play-ic");
  var cur = REST, playing = false, visible = true, raf = 0, last = 0, stepTimer = 0;

  function setIcon(){
    playIc.setAttribute("d", playing ? "M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" : "M4 2.5v11l9-5.5z");
    playBtn.setAttribute("aria-label", playing ? "暫停" : "播放");
  }
  function seek(t){ cur = draw(t); scrub.value = String(cur); return cur; }
  function pause(){ playing = false; cancelAnimationFrame(raf); raf = 0; clearTimeout(stepTimer); setIcon(); }
  function frame(now){
    raf = 0;
    if (!playing || !visible) return;
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    seek(cur + dt * SPEED);
    if (cur >= DUR){ pause(); return; }
    raf = requestAnimationFrame(frame);
  }
  function stepTick(){ // 減少動態：一格一格跳
    if (!playing) return;
    var next = Math.min(DUR, Math.floor(cur + 0.011) + 0.99);
    seek(next >= 5.99 ? DUR : next);
    if (cur >= DUR) { pause(); return; }
    stepTimer = setTimeout(stepTick, 1800);
  }
  function play(){
    if (cur >= DUR - 0.02 || Math.abs(cur - REST) < 0.005) seek(0);
    playing = true; setIcon();
    if (reduce.matches){ seek(Math.floor(cur) + 0.99); stepTimer = setTimeout(stepTick, 1800); return; }
    last = performance.now();
    if (!raf && visible) raf = requestAnimationFrame(frame);
  }
  playBtn.addEventListener("click", function(){ playing ? pause() : play(); });
  scrub.addEventListener("input", function(){ pause(); seek(parseFloat(scrub.value)); });
  fig.addEventListener("keydown", function(e){
    if (e.target === scrub) return;
    var s = Math.min(5, Math.floor(cur));
    if (e.key === "ArrowRight"){ pause(); seek(Math.min(5, s + 1) + 0.99); e.preventDefault(); }
    else if (e.key === "ArrowLeft"){ pause(); seek(Math.max(0, s - 1) + 0.99); e.preventDefault(); }
    else if (e.key === " " && e.target === fig){ playing ? pause() : play(); e.preventDefault(); }
    else if (e.key === "Home"){ pause(); seek(0.99); e.preventDefault(); }
    else if (e.key === "End"){ pause(); seek(DUR); e.preventDefault(); }
  });

  // 主題切換
  $("og-theme").addEventListener("click", function(){
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  // 只在看得到時跑
  if ("IntersectionObserver" in window){
    new IntersectionObserver(function(es){
      visible = es[0].isIntersecting;
      if (visible && playing && !reduce.matches && !raf){ last = performance.now(); raf = requestAnimationFrame(frame); }
    }, {rootMargin:"120px"}).observe(fig);
  }

  // 高度回報給外層頁面（每次尺寸變化最多一則）
  var lastH = 0;
  if ("ResizeObserver" in window && window.parent !== window){
    new ResizeObserver(function(){
      var h = Math.ceil(fig.getBoundingClientRect().height) + 4;
      if (h !== lastH){ lastH = h; try { window.parent.postMessage({type:"fig-height", fig:"outbox-gap", height:h}, "*"); } catch(e){} }
    }).observe(fig);
  }

  window.DUR = DUR;
  window.seek = function(t){ pause(); return seek(+t); };
  window.timeline = function(){ return {dur:DUR, rest:REST, steps:STEPS.length}; };

  seek(REST); setIcon();
})();
</script>
</body>
</html>
