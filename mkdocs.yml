site_name: 後端基本功
site_description: 給新進後端工程師的 50 篇入門教材：並行與交易、資料庫效能、快取、重試與容錯、訊息佇列、分散式一致性與維運。每篇從具體的出事情境開始，用時間軸和圖講清楚機制。
docs_dir: docs
repo_url: https://git.hy-tech.com.tw/ben.tsai/newbiebook
repo_name: ben.tsai/newbiebook
edit_uri: -/edit/main/docs/

theme:
  name: material
  language: zh-TW
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切換成深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切換成淺色
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

markdown_extensions:
  - md_in_html
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

